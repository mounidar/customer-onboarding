# CI = Continuous Integration.
# Runs on every Pull Request and on every push to main.
# If any step fails, the PR shows a red ❌ and (with branch protection) can't be merged.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    name: API (.NET build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Onboarding.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore packages
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      # When you add a test project, add: dotnet test --no-build --configuration Release

  dashboard:
    name: Dashboard (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employee-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: employee-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
